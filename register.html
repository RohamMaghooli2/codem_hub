<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ثبت‌نام کاستم</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="register-page">

    <div class="register-header">

        <a href="custom-details.html" class="back-btn">
            ← بازگشت
        </a>

        <h1>📝 ثبت‌نام در کاستم</h1>

    </div>

    <div class="register-form">

        <input
            id="teamName"
            type="text"
            placeholder="🏷️ نام تیم"
        >

        <input
            id="player1"
            type="text"
            placeholder="👤 نام بازیکن اول"
        >

        <input
            id="player1Id"
            type="text"
            placeholder="🆔 آیدی بازیکن اول"
        >

        <input
            id="player2"
            type="text"
            placeholder="👤 نام بازیکن دوم"
        >

        <input
            id="player2Id"
            type="text"
            placeholder="🆔 آیدی بازیکن دوم"
        >

        <input
            id="phone"
            type="tel"
            placeholder="📱 شماره تماس (اختیاری)"
        >

        <button
            id="registerBtn"
            class="register-submit"
            type="button"
        >
            ثبت نهایی
        </button>

    </div>

</div>

<script type="module" src="register.js"></script>

</body>

</html>
