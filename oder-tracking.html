<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>پیگیری سفارش | Codem Hub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="tracking-body">

    <main class="tracking-page">

        <header class="tracking-header">

            <a href="shop.html" class="back-btn">
                ← فروشگاه
            </a>

            <div class="tracking-title">

                <div class="tracking-icon">
                    🔎
                </div>

                <div>
                    <h1>پیگیری سفارش</h1>
                    <p>کد پیگیری خود را وارد کنید</p>
                </div>

            </div>

        </header>


        <section class="tracking-card">

            <div class="tracking-card-title">

                <span>🎫</span>

                <div>
                    <h2>کد پیگیری</h2>
                    <p>مثلاً CODS-123456</p>
                </div>

            </div>


            <div class="tracking-input">

                <span>🔐</span>

                <input
                    id="trackingInput"
                    type="text"
                    placeholder="CODS-XXXXXX"
                    autocomplete="off"
                >

            </div>


            <button
                id="trackingBtn"
                class="tracking-btn"
                type="button">

                🔎 پیگیری سفارش

            </button>

        </section>


        <section
            id="trackingResult"
            class="tracking-result">

        </section>

    </main>


    <nav class="bottom-nav">

        <a href="index.html" class="nav-item">

            <span>⌂</span>
            خانه

        </a>


        <a href="shop.html" class="nav-item">

            <span>🛍️</span>
            فروشگاه

        </a>


        <a href="cart.html" class="nav-item">

            <span>🛒</span>
            سبد خرید

        </a>

    </nav>


    <script src="order-tracking.js"></script>

</body>

</html>
